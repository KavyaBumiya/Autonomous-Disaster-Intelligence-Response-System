services:
  db:
    image: postgis/postgis:15-3.4
    container_name: aegisai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisai}
      POSTGRES_USER: ${POSTGRES_USER:-aegisai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisai_secret}
    ports:
      - "5433:5432"   # host 5432 occupied by another project
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated Postgres for the test suite. Separate from `db` so that running the
  # tests can never write into the database the application serves — previously
  # the suite inherited DATABASE_URL and polluted it with "Test Zone" rows that
  # could be selected as the primary zone by /api/zones.
  db_test:
    image: postgis/postgis:15-3.4
    container_name: aegisai_db_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisai}
      POSTGRES_USER: ${POSTGRES_USER:-aegisai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisai_secret}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
      # Creates aegisai_test on first start; see the comment in that file.
      - ./backend/tests/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegisai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisai_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegisai}:${POSTGRES_PASSWORD:-aegisai_secret}@db:5432/${POSTGRES_DB:-aegisai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - audio_uploads:/app/media/audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:socket_app --host 0.0.0.0 --port 8000"

  # The operator UI is built and hosted separately, so there is no frontend
  # service here. It talks to this API over HTTP/WebSocket; set FRONTEND_ORIGIN
  # in .env to allow its origin.

volumes:
  pgdata:
  pgdata_test:
  audio_uploads:

services:
  - type: web
    name: aegis-ai-backend
    runtime: docker
    plan: free
    # The Dockerfile lives in backend/, not the repo root.
    rootDir: backend
    # Cheap process liveness only. It touches no database, cache or provider, so
    # a transient DB blip cannot mark the service unhealthy and trigger a restart.
    # `/readyz` (database readiness) and `/api/health` (detailed provider status)
    # are intentionally separate — polling the detailed endpoint for liveness
    # would make every provider hiccup look like a dead process.
    healthCheckPath: /healthz
    envVars:
      # ── Required ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # ── Cache (optional — API degrades to "degraded" if absent) ─
      - key: REDIS_URL
        sync: false
      # ── Frontend origin (comma-separated; empty = allow all) ──
      - key: FRONTEND_ORIGIN
        sync: false
      # Scoped regex for Vercel preview URLs (commit SHA changes per deploy).
      # Matches:
      #   https://autonomous-disaster-int.vercel.app
      #   https://autonomous-disaster-intelligence.vercel.app
      #   https://autonomous-disaster-int-git-<sha>-<user>-<scope>.vercel.app
      # Does NOT match: *.vercel.app (that would allow any Vercel project).
      - key: FRONTEND_ORIGIN_REGEX
        value: "https://autonomous-disaster-int(?:elligence)?(-[a-z0-9-]+)*\\.vercel\\.app"
      - key: APP_ENV
        value: production
      # openai-whisper is not in the image (too heavy for the free tier),
      # so voice reports return an honest error instead of transcribing.
      - key: STT_PROVIDER
        value: disabled
      # ── External providers (optional) ──────────────────────────
      - key: HF_TOKEN
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Pinned explicitly rather than relying on the code default. The default
      # (deepseek-ai/deepseek-v4.1-flash) is listed in the NIM catalog but does
      # not answer /chat/completions — it exhausted the 60s timeout on all 3
      # attempts and the gateway reported "provider unreachable", which was
      # indistinguishable from a bad key. Keep this in step with
      # `nvidia_model` in backend/app/core/config.py.
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: OPENAI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false

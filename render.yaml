# Render.com Deployment Blueprint for AegisAI Backend
# Reference: https://render.com/docs/blueprint-spec

services:
  # ── Backend API Service (Docker) ─────────────────────────────────
  - type: web
    name: aegisai-backend
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegisai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aegisai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WHISPER_MODEL
        value: base
      - key: NLP_MODEL_PATH
        value: models/nlp/v1
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false

  # ── Redis Key-Value Store ─────────────────────────────────────────
  - type: keyvalue
    name: aegisai-redis
    plan: free
    ipAllowList: []

# ── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: aegisai-db
    databaseName: aegisai
    user: aegisai
    plan: free